<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안순찬</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/[email protected]/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --ink:#1c1a17;
    --paper:#f1ede4;
    --paper-deep:#e5ddcf;
    --mist:#83796a;
    --mist-light:#a89f8f;
    --seal:#9c2f22;
    --line: rgba(28,26,23,0.14);
    --max: 640px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 24px; position:relative; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }

  .ink-mark{
    position:absolute; top:-10%; left:50%; transform:translateX(-50%);
    width:340px; height:340px; z-index:0; pointer-events:none; opacity:0.5;
  }
  .ink-mark span{ position:absolute; border-radius:50%; mix-blend-mode:multiply; }
  .ink-mark span:nth-child(1){
    width:78%; height:66%; top:14%; left:11%;
    background:radial-gradient(ellipse at 42% 40%, rgba(28,26,23,0.8), rgba(28,26,23,0.4) 55%, transparent 76%);
    filter:blur(4px);
  }
  .ink-mark span:nth-child(2){
    width:24%; height:24%; top:56%; left:60%;
    background:radial-gradient(circle at 50% 50%, rgba(156,47,34,0.75), transparent 72%);
    filter:blur(3px);
  }

  .wrap{ position:relative; z-index:1; max-width:var(--max); width:100%; text-align:center; }
  .portrait{
    width:132px; height:132px; border-radius:50%; overflow:hidden;
    margin:0 auto 28px; border:1px solid var(--line-strong,rgba(28,26,23,.28));
    box-shadow:0 1px 0 rgba(28,26,23,0.06);
  }
  .portrait img{ width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(0.15); }
  .eyebrow{
    font-weight:600; font-size:12.5px; letter-spacing:0.16em; color:var(--mist);
    text-transform:uppercase; margin-bottom:20px; display:block;
  }
  h1{
    font-weight:800; font-size:clamp(28px, 6vw, 40px);
    letter-spacing:-0.02em; margin-bottom:48px;
  }

  nav.menu{ display:flex; flex-direction:column; gap:14px; }
  .menu-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 24px; border:1px solid var(--line); border-radius:6px;
    background:rgba(255,255,255,0.3);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .menu-item:hover{ border-color:var(--line-strong,rgba(28,26,23,.3)); background:rgba(255,255,255,0.55); transform:translateX(2px); }
  .menu-title{ font-weight:700; font-size:17px; }
  .menu-desc{ font-size:12.5px; color:var(--mist-light); margin-top:3px; }
  .menu-arrow{ font-weight:700; color:var(--mist); font-size:15px; }
  .menu-item.locked .menu-arrow{ color:var(--seal); }
  .menu-item.locked .menu-desc{ color:var(--seal); }
</style>
</head>
<body>
  <div class="ink-mark" aria-hidden="true"><span></span><span></span></div>
  <div class="wrap">
    <div class="portrait"><img src="assets/profile.jpg" alt="안순찬"></div>
    <span class="eyebrow">안순찬</span>
    <h1>안녕하세요! 안순찬입니다.</h1>

    <nav class="menu">
      <a href="cv.html" class="menu-item">
        <div>
          <div class="menu-title">CV</div>
        </div>
        <span class="menu-arrow">→</span>
      </a>
      <a href="values.html" class="menu-item">
        <div>
          <div class="menu-title">가치관</div>
        </div>
        <span class="menu-arrow">→</span>
      </a>
      <a href="roadmap.html" class="menu-item locked">
        <div>
          <div class="menu-title">인생 로드맵</div>
          <div class="menu-desc">🔒 비공개 — 암호 필요</div>
        </div>
        <span class="menu-arrow">→</span>
      </a>
    </nav>
  </div>
</body>
</html>
